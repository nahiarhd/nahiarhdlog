<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nahiarhdlog</title>
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="static/overpass.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Set the theme before first paint so dark mode never flashes light.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("nhl_theme"); } catch (e) { /* ignore */ }
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="stylesheet" href="static/styles.css">
</head>
<body>
<header class="band">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M5 21.5h7.5l7-7H27" fill="none" stroke="#78a4ff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19.5 5v22" fill="none" stroke="#b896ff" stroke-width="3.4" stroke-linecap="round"/>
      <circle class="hub" cx="19.5" cy="14.5" r="4.4" fill="#14213d" stroke="#ffffff" stroke-width="2.6"/>
    </svg>
    <span class="brand-name">nahiarhdlog</span>
    <span class="brand-version" id="version"></span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab active" role="tab" id="tab-logs" data-view="logs" type="button" aria-selected="true" aria-controls="view-logs" tabindex="0">Logs</button>
    <button class="tab" role="tab" id="tab-errors" data-view="errors" type="button" aria-selected="false" aria-controls="view-errors" tabindex="-1">Errors</button>
    <button class="tab" role="tab" id="tab-metrics" data-view="metrics" type="button" aria-selected="false" aria-controls="view-metrics" tabindex="-1">Metrics</button>
    <button class="tab" role="tab" id="tab-trace" data-view="trace" type="button" aria-selected="false" aria-controls="view-trace" tabindex="-1">Trace</button>
  </nav>
  <div class="band-right">
    <button class="band-btn status-btn" id="status-btn" type="button" data-status="unknown" aria-expanded="false" aria-controls="status-pop">
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-text" id="status-text">Checking service</span>
      <span class="status-short" id="status-short" aria-hidden="true">Checking</span>
      <span class="queued-badge hidden" id="queued-badge"></span>
      <span class="dropped-badge hidden" id="dropped-badge"></span>
    </button>
    <div class="status-pop hidden" id="status-pop" role="region" aria-label="Service status details">
      <h2 id="pop-title">Checking service</h2>
      <p id="pop-reason"></p>
      <dl id="pop-dl"></dl>
    </div>
    <button class="band-btn" id="logout-btn" type="button">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      Lock
    </button>
    <button class="band-btn icon-only" id="theme-toggle" type="button" aria-label="Switch color theme">
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div class="banner hidden" id="banner" role="alert">
  <span id="banner-text"></span>
  <button type="button" class="banner-close" id="banner-close" aria-label="Dismiss message">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>

<main>
  <section id="view-logs" class="view active" role="tabpanel" aria-labelledby="tab-logs" tabindex="0">
    <form id="log-filters" class="toolbar" autocomplete="off" role="search">
      <label class="search">
        <span class="sr-only">Search messages</span>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <input type="search" id="f-text" class="field" placeholder="Search messages" aria-keyshortcuts="/">
        <span class="kbd" aria-hidden="true">/</span>
      </label>
      <select id="f-level" class="field" aria-label="Level">
        <option value="">All levels</option>
        <option>DEBUG</option><option>INFO</option><option>WARNING</option>
        <option>ERROR</option><option>CRITICAL</option>
      </select>
      <select id="f-type" class="field" aria-label="Event type">
        <option value="">All event types</option>
        <option value="log">Logs</option><option value="request">Requests</option>
        <option value="error">Errors</option><option value="span">Spans</option>
      </select>
      <select id="f-range" class="field" aria-label="Time range">
        <option value="0">All time</option>
        <option value="900">Last 15 minutes</option>
        <option value="3600">Last hour</option>
        <option value="21600">Last 6 hours</option>
        <option value="86400">Last 24 hours</option>
        <option value="604800">Last 7 days</option>
        <option value="custom" hidden>Selected range</option>
      </select>
      <label class="check live" id="live-label"><input type="checkbox" id="f-live"><span class="live-dot" aria-hidden="true"></span>Live tail</label>
      <button type="submit" class="btn primary">Search</button>
      <button type="button" class="btn quiet" id="f-clear">Clear filters</button>
    </form>
    <div>
      <span id="sig-chip" class="filter-chip hidden">
        <span>Signature <span id="sig-chip-text" class="mono"></span></span>
        <button type="button" id="sig-chip-clear" aria-label="Remove signature filter"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
      </span>
      <span id="range-chip" class="range-chip hidden">
        <span id="range-chip-text"></span>
        <button type="button" id="range-chip-clear" aria-label="Remove selected time range"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
      </span>
    </div>
    <div class="volume" id="volume" aria-label="Event volume over time"></div>
    <p class="meta" id="logs-meta"></p>
    <div class="table-wrap">
      <table id="logs-table">
        <thead><tr><th scope="col">Time</th><th scope="col">Line</th><th scope="col" class="c-level">Level</th><th scope="col">Message</th><th scope="col" class="c-trace">Trace</th></tr></thead>
        <tbody id="logs-body"></tbody>
      </table>
    </div>
    <div class="pager">
      <button type="button" class="btn" id="page-prev"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Newer</button>
      <span id="page-info" class="meta"></span>
      <button type="button" class="btn" id="page-next">Older<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </section>

  <section id="view-errors" class="view" role="tabpanel" aria-labelledby="tab-errors" tabindex="0">
    <div class="toolbar">
      <select id="e-window" class="field" aria-label="Error window">
        <option value="0" selected>All retained errors</option>
        <option value="3600">Last hour</option>
        <option value="86400">Last 24 hours</option>
        <option value="604800">Last 7 days</option>
      </select>
      <button type="button" class="btn" id="e-refresh">Refresh</button>
    </div>
    <p class="meta" id="errors-meta"></p>
    <div id="errors-list"></div>
  </section>

  <section id="view-metrics" class="view" role="tabpanel" aria-labelledby="tab-metrics" tabindex="0">
    <div class="toolbar">
      <select id="m-window" class="field" aria-label="Metrics window">
        <option value="300">Last 5 minutes</option>
        <option value="3600" selected>Last hour</option>
        <option value="21600">Last 6 hours</option>
        <option value="86400">Last 24 hours</option>
      </select>
      <button type="button" class="btn" id="m-refresh">Refresh</button>
      <label class="check"><input type="checkbox" id="m-auto"> Refresh every 15 s</label>
      <span class="meta push-right" id="m-updated"></span>
    </div>
    <div class="line-status" id="line-status" data-status="idle">
      <span class="big-dot" aria-hidden="true"></span>
      <div><h2 id="ls-title">Loading metrics</h2><p id="ls-reason"></p></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="charts">
      <figure class="chart-card">
        <figcaption>Requests and errors</figcaption>
        <div id="chart-req"></div>
        <div class="chart-legend" id="legend-req" hidden>
          <span><i style="--c: var(--l-request)"></i>Requests</span>
          <span><i style="--c: var(--disrupt)"></i>Errors (5xx)</span>
        </div>
      </figure>
      <figure class="chart-card">
        <figcaption>Latency</figcaption>
        <div id="chart-lat"></div>
        <div class="chart-legend" id="legend-lat" hidden>
          <span><i style="--c: var(--l-request)"></i>p95</span>
          <span><i style="--c: var(--l-log)"></i>Average</span>
          <span id="thr-swatch"><i class="dashed" style="--c: var(--delay)"></i>Status thresholds</span>
          <span id="thr-note"></span>
        </div>
      </figure>
    </div>
  </section>

  <section id="view-trace" class="view" role="tabpanel" aria-labelledby="tab-trace" tabindex="0">
    <form id="trace-form" class="toolbar trace-form" autocomplete="off">
      <label class="search">
        <span class="sr-only">Trace id</span>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <input type="search" id="t-id" class="field mono" placeholder="Trace id, or its first 8 characters">
      </label>
      <button type="submit" class="btn primary">Show trace</button>
      <button type="button" class="btn quiet" id="t-recent">Recent traces</button>
    </form>
    <div id="trace-list"></div>
  </section>
</main>

<div id="chart-tip" class="chart-tip" hidden role="tooltip"></div>

<aside id="inspector" class="inspector" aria-labelledby="detail-title" aria-hidden="true">
  <div class="insp-head">
    <div class="insp-titles">
      <div id="detail-badge-bar" class="detail-badges"></div>
      <h2 id="detail-title">Event</h2>
    </div>
    <div class="insp-actions">
      <button type="button" class="btn small" id="detail-copy-json">Copy JSON</button>
      <button type="button" class="btn small" id="detail-copy-curl" hidden title="Secrets stay redacted">Copy as cURL</button>
      <button type="button" class="btn small" id="detail-trace-btn" hidden>View trace</button>
      <button type="button" class="btn small quiet" id="detail-close" aria-label="Close inspector">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div id="detail-body"></div>
  <div class="insp-hint"><kbd>J</kbd> and <kbd>K</kbd> move between events. <kbd>Esc</kbd> closes this panel.</div>
</aside>

<script src="static/app.js"></script>
</body>
</html>
