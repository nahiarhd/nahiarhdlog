<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nahiarhdlog — locked</title>
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("nhl_theme"); } catch (e) { /* ignore */ }
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="stylesheet" href="static/styles.css">
</head>
<body class="lock-body">
  <form class="lock-card" id="lock-form" autocomplete="off">
    <h1>nahiarhdlog is locked</h1>
    <p>Enter the dashboard token to continue.</p>
    <p class="err" id="err" role="alert"></p>
    <label for="token">Dashboard token</label>
    <input type="password" id="token" autocomplete="current-password" autofocus>
    <button type="submit" class="btn primary" id="unlock">Unlock</button>
  </form>
<script>
  (function () {
    "use strict";
    var base = location.pathname.replace(/\/static\/.*$/, "/").replace(/\/$/, "") || "/";
    if (base === "/") base = "";
    var form = document.getElementById("lock-form");
    var input = document.getElementById("token");
    var err = document.getElementById("err");
    var btn = document.getElementById("unlock");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var t = input.value.trim();
      if (!t) return;
      err.textContent = "";
      btn.disabled = true;
      fetch(base + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: t }),
      }).then(function (r) {
        if (r.ok) {
          location.assign(base + "/");
        } else if (r.status === 403) {
          err.textContent = "Wrong token, try again.";
          btn.disabled = false;
          input.select();
        } else {
          throw new Error("login failed: " + r.status);
        }
      }).catch(function (ex) {
        err.textContent = "Could not reach the server (" + ex.message + ").";
        btn.disabled = false;
      });
    });
  })();
</script>
</body>
</html>
