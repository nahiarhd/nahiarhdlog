<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nahiarhdlog — locked</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f3f4f6; color: #1f2937;
  }
  @media (prefers-color-scheme: dark) { body { background: #111827; color: #f3f4f6; } }
  .card {
    background: #fff; border: 1px solid #d1d5db; border-radius: 10px;
    padding: 28px 32px; width: min(360px, 92vw);
  }
  @media (prefers-color-scheme: dark) { .card { background: #1f2937; border-color: #374151; } }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { font-size: 14px; margin: 0 0 14px; opacity: .8; }
  p.err { color: #b42318; font-weight: 600; min-height: 20px; }
  @media (prefers-color-scheme: dark) { p.err { color: #f97066; } }
  input {
    width: 100%; padding: 9px 11px; font-size: 14px; border-radius: 6px;
    border: 1px solid #9ca3af; margin-bottom: 12px;
  }
  button {
    width: 100%; padding: 9px; font-size: 14px; font-weight: 600; border: 0;
    border-radius: 6px; background: #0f766e; color: #fff; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
  <form class="card" id="lock-form" autocomplete="off">
    <h1>nahiarhdlog is locked</h1>
    <p>Enter the dashboard token to continue.</p>
    <p class="err" id="err" role="alert"></p>
    <input type="password" id="token" placeholder="Dashboard token" aria-label="Dashboard token" autofocus>
    <button type="submit" id="unlock">Unlock</button>
  </form>
<script>
  (function () {
    "use strict";
    var base = location.pathname.replace(/\/static\/.*$/, "/").replace(/\/$/, "") || "/";
    if (base === "/") base = "";
    var form = document.getElementById("lock-form");
    var input = document.getElementById("token");
    var err = document.getElementById("err");
    var btn = document.getElementById("unlock");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var t = input.value.trim();
      if (!t) return;
      err.textContent = "";
      btn.disabled = true;
      fetch(base + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: t }),
      }).then(function (r) {
        if (r.ok) {
          location.assign(base + "/");
        } else if (r.status === 403) {
          err.textContent = "Wrong token, try again.";
          btn.disabled = false;
          input.select();
        } else {
          throw new Error("login failed: " + r.status);
        }
      }).catch(function (ex) {
        err.textContent = "Could not reach the server (" + ex.message + ").";
        btn.disabled = false;
      });
    });
  })();
</script>
</body>
</html>
