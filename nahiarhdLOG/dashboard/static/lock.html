<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nahiarhdlog is locked</title>
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("nhl_theme"); } catch (e) { /* ignore */ }
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="stylesheet" href="static/styles.css">
</head>
<body class="lock-body">
  <header class="band">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M5 21.5h7.5l7-7H27" fill="none" stroke="#78a4ff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19.5 5v22" fill="none" stroke="#b896ff" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="19.5" cy="14.5" r="4.4" fill="#14213d" stroke="#ffffff" stroke-width="2.6"/>
      </svg>
      <span class="brand-name">nahiarhdlog</span>
    </div>
  </header>
  <main class="lock-main">
    <form class="lock-card" id="lock-form" autocomplete="off">
      <h1>This dashboard is locked</h1>
      <p>Enter the dashboard token from your app's configuration to see its logs, errors, metrics, and traces.</p>
      <p class="err" id="err" role="alert"></p>
      <label for="token">Dashboard token</label>
      <input class="field" type="password" id="token" autocomplete="current-password" autofocus required>
      <button type="submit" class="btn primary" id="unlock">Unlock</button>
    </form>
  </main>
<script>
  (function () {
    "use strict";
    var base = location.pathname.replace(/\/static\/.*$/, "/").replace(/\/$/, "") || "/";
    if (base === "/") base = "";
    var form = document.getElementById("lock-form");
    var input = document.getElementById("token");
    var err = document.getElementById("err");
    var btn = document.getElementById("unlock");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var t = input.value.trim();
      if (!t) return;
      err.textContent = "";
      btn.disabled = true;
      btn.textContent = "Unlocking";
      function reset(message) {
        err.textContent = message;
        btn.disabled = false;
        btn.textContent = "Unlock";
      }
      fetch(base + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: t }),
      }).then(function (r) {
        if (r.ok) {
          location.assign(base + "/");
        } else if (r.status === 403) {
          reset("That token doesn't match. Check dashboard_token in your app and try again.");
          input.select();
        } else {
          reset("Login failed with HTTP " + r.status + ". The app's own logs have the cause.");
        }
      }, function () {
        reset("The app is unreachable. Check that it is running, then try again.");
      });
    });
  })();
</script>
</body>
</html>
