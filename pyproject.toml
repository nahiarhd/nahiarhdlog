[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nahiarhdlog"
version = "0.4.0"
description = "Embedded observability for FastAPI: searchable logs, error tracking, alerts, metrics, and tracing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Raihan Hidayatullah Djunaedi", email = "raihanhd.dev@gmail.com"},
]
keywords = ["fastapi", "logging", "observability", "monitoring", "error-tracking", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/nahiarhd/nahiarhdlog"
Documentation = "https://github.com/nahiarhd/nahiarhdlog#readme"
Repository = "https://github.com/nahiarhd/nahiarhdlog"
Issues = "https://github.com/nahiarhd/nahiarhdlog/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "uvicorn>=0.24.0",
    "httpx2>=2.0.0",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nahiarhdLOG*"]

[tool.setuptools.package-data]
"nahiarhdLOG" = ["py.typed", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
