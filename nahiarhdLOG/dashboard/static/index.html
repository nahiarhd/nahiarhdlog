<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nahiarhdlog</title>
<link rel="stylesheet" href="static/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    <span class="brand-name">nahiarhdlog</span>
    <span class="brand-version" id="version"></span>
  </div>
  <nav class="tabs" aria-label="Views">
    <button class="tab active" data-view="logs" type="button">Logs</button>
    <button class="tab" data-view="errors" type="button">Errors</button>
    <button class="tab" data-view="metrics" type="button">Metrics</button>
    <button class="tab" data-view="trace" type="button">Trace</button>
  </nav>
  <div class="topbar-right">
    <span class="health" id="health" title="Collector queue / dropped events">
      <span class="dot ok" id="health-dot"></span><span id="health-text">…</span>
    </span>
    <button class="btn small" id="logout-btn" type="button">Lock</button>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle color theme">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="banner hidden" id="banner" role="alert"></div>

<main>
  <section id="view-logs" class="view active" aria-label="Logs">
    <form id="log-filters" class="filters" autocomplete="off">
      <input type="search" id="f-text" placeholder="Search messages…" aria-label="Search messages">
      <select id="f-level" aria-label="Level">
        <option value="">All levels</option>
        <option>DEBUG</option><option>INFO</option><option>WARNING</option>
        <option>ERROR</option><option>CRITICAL</option>
      </select>
      <select id="f-type" aria-label="Event type">
        <option value="">All types</option>
        <option value="log">log</option><option value="request">request</option>
        <option value="error">error</option>
      </select>
      <label class="live"><input type="checkbox" id="f-live"> Live tail</label>
      <button type="submit" class="btn primary">Apply</button>
      <button type="button" class="btn" id="f-clear">Clear</button>
    </form>
    <p class="meta" id="logs-meta"></p>
    <div class="table-wrap">
      <table id="logs-table">
        <thead><tr><th scope="col">Time</th><th scope="col">Level</th><th scope="col">Type</th><th scope="col">Message</th><th scope="col">Trace</th></tr></thead>
        <tbody id="logs-body"></tbody>
      </table>
    </div>
    <div class="pager">
      <button type="button" class="btn" id="page-prev">← Prev</button>
      <span id="page-info" class="meta"></span>
      <button type="button" class="btn" id="page-next">Next →</button>
    </div>
  </section>

  <section id="view-errors" class="view" aria-label="Errors">
    <p class="meta" id="errors-meta"></p>
    <div id="errors-list" class="cards"></div>
  </section>

  <section id="view-metrics" class="view" aria-label="Metrics">
    <div class="filters">
      <label>Window
        <select id="m-window">
          <option value="300">Last 5 minutes</option>
          <option value="3600" selected>Last hour</option>
          <option value="21600">Last 6 hours</option>
          <option value="86400">Last 24 hours</option>
        </select>
      </label>
      <button type="button" class="btn" id="m-refresh">Refresh</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="charts">
      <figure class="chart-card">
        <figcaption>Requests &amp; errors</figcaption>
        <div id="chart-req"></div>
      </figure>
      <figure class="chart-card">
        <figcaption>Avg latency (ms)</figcaption>
        <div id="chart-lat"></div>
      </figure>
    </div>
  </section>

  <section id="view-trace" class="view" aria-label="Trace">
    <form id="trace-form" class="filters" autocomplete="off">
      <input type="search" id="t-id" placeholder="trace id…" aria-label="Trace id" class="mono">
      <button type="submit" class="btn primary">Show trace</button>
    </form>
    <ol id="trace-list" class="timeline"></ol>
  </section>
</main>

<dialog id="detail" aria-label="Event detail">
  <div class="dialog-head">
    <strong id="detail-title">Event</strong>
    <button type="button" class="btn" id="detail-close">Close</button>
  </div>
  <div id="detail-body"></div>
</dialog>

<script src="static/app.js"></script>
</body>
</html>
